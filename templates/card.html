<!doctype html>
<html style="--card-w: {{ page_w_pt or 841.89 }}pt; --card-h: {{ page_h_pt or 372.72 }}pt;">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --card-w: 841.89pt;
    --card-h: 372.72pt;
  }
  @font-face {
    font-family: "Montserrat-Bold";
    src: url("{{ asset_prefix }}fonts/Montserrat-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "Montserrat-Bold";
    src: url("{{ asset_prefix }}fonts/Montserrat-Bold.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("{{ asset_prefix }}fonts/Montserrat-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("{{ asset_prefix }}fonts/Montserrat-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "MyriadPro";
    src: url("{{ asset_prefix }}fonts/MYRIADPRO-REGULAR.woff") format("woff");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "MyriadPro";
    src: url("{{ asset_prefix }}fonts/MYRIADPRO-BOLD.woff") format("woff");
    font-weight: 700;
    font-style: normal;
  }

  @page {
    margin: 0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    line-height: 1;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  html, body, #card, #bg, .block {
    width: var(--card-w);
    height: var(--card-h);
  }

  #card {
    position: relative;
    overflow: hidden;
    background: #ffffff;
  }

  #bg, .block {
    position: absolute;
    left: 0;
    top: 0;
  }

  #bg {
    display: block;
  }

  #block-flip {
    transform: rotate(180deg);
    transform-origin: calc(var(--card-w) / 2) calc(var(--card-h) / 2);
  }
</style>
</head>
<body>
  <div id="card">
    {% if custom_bg_data %}
    <img id="bg" src="{{ custom_bg_data }}" alt="Background">
    {% else %}
    <img id="bg" src="{{ asset_prefix }}template_background_new.png" alt="Background">
    {% endif %}
    <div id="block-normal" class="block"></div>
    {% if sides != '1' %}
    <div id="block-flip" class="block"></div>
    {% endif %}
  </div>

  <script type="application/json" id="card-config">
  {
    "name": {{ name|tojson }},
    "position": {{ position|tojson }},
    "content_mode": {{ (content_mode or 'both')|tojson }},
    "font_name_choice": {{ (font_name_choice or 'Montserrat')|tojson }},
    "custom_font_name_data": {{ (custom_font_name_data or '')|tojson }},
    "custom_font_name_filename": {{ (custom_font_name_filename or '')|tojson }},
    "font_pos_choice": {{ (font_pos_choice or 'Montserrat')|tojson }},
    "custom_font_pos_data": {{ (custom_font_pos_data or '')|tojson }},
    "custom_font_pos_filename": {{ (custom_font_pos_filename or '')|tojson }},
    "font_size_name": {{ font_size_name|tojson }},
    "font_size_pos": {{ font_size_pos|tojson }},
    "spacing_gap": {{ spacing_gap|tojson }},
    "spacing_is_manual": {{ (spacing_is_manual or '0')|tojson }},
    "horizontal_offset": {{ (horizontal_offset or 0)|tojson }},
    "text_case": {{ (text_case or 'uppercase')|tojson }},
    "paper_size": {{ (paper_size or 'a4')|tojson }},
    "page_w_pt": {{ page_w_pt or 841.89 }},
    "page_h_pt": {{ page_h_pt or 372.72 }},
    "sides": {{ (sides or '2')|tojson }}
  }
  </script>

  <script src="{{ asset_prefix }}nametag.js?v=20261124b"></script>
  <script>
    const CONFIG = JSON.parse(document.getElementById("card-config").textContent);
    const NAME = CONFIG.name;
    const POSITION = CONFIG.position;
    const CONTENT_MODE = CONFIG.content_mode || 'both';

    // Inject dynamic @page size style for exact PDF printing
    const pw = CONFIG.page_w_pt || 841.89;
    const ph = CONFIG.page_h_pt || 372.72;
    const pageStyle = document.createElement("style");
    pageStyle.textContent = `@page { size: ${pw}pt ${ph}pt; margin: 0; }`;
    document.head.appendChild(pageStyle);

    // Inject custom font faces if provided
    if (CONFIG.custom_font_name_data) {
      const s = document.createElement("style");
      s.textContent = `@font-face { font-family: "${CONFIG.custom_font_name_filename || 'CustomNameFont'}"; src: url("${CONFIG.custom_font_name_data}"); }`;
      document.head.appendChild(s);
    }
    if (CONFIG.custom_font_pos_data) {
      const s = document.createElement("style");
      s.textContent = `@font-face { font-family: "${CONFIG.custom_font_pos_filename || 'CustomPosFont'}"; src: url("${CONFIG.custom_font_pos_data}"); }`;
      document.head.appendChild(s);
    }

    function resolveFontFamily(choice, customData, customName) {
      if (customData && customName) return `"${customName}", sans-serif`;
      switch (choice) {
        case "Montserrat": return '"Montserrat-Bold", Montserrat, sans-serif';
        case "MyriadPro": return "MyriadPro, Arial, Helvetica, sans-serif";
        case "Arial": return "Arial, sans-serif";
        case "Times New Roman": return "'Times New Roman', Times, serif";
        case "Calibri": return "Calibri, Candara, sans-serif";
        case "Roboto": return "'Roboto', sans-serif";
        case "Open Sans": return "'Open Sans', sans-serif";
        case "Georgia": return "Georgia, serif";
        case "Garamond": return "'EB Garamond', Garamond, serif";
        case "Plus Jakarta Sans": return "'Plus Jakarta Sans', sans-serif";
        default:
          return '"Montserrat-Bold", Montserrat, sans-serif';
      }
    }

    const nameFontFamily = resolveFontFamily(
      CONFIG.font_name_choice,
      CONFIG.custom_font_name_data,
      CONFIG.custom_font_name_filename
    );

    const posFontFamily = resolveFontFamily(
      CONFIG.font_pos_choice,
      CONFIG.custom_font_pos_data,
      CONFIG.custom_font_pos_filename
    );

    if (window.setNameFontFamily) window.setNameFontFamily(nameFontFamily);
    if (window.setPosFontFamily) window.setPosFontFamily(posFontFamily);
    if (window.setNameFontSize) window.setNameFontSize(CONFIG.font_size_name);
    if (window.setPosFontSize) window.setPosFontSize(CONFIG.font_size_pos);
    if (window.setSpacingGap) window.setSpacingGap(CONFIG.spacing_gap);
    if (window.setHorizontalOffset) window.setHorizontalOffset(CONFIG.horizontal_offset);
    if (window.setTextCase) window.setTextCase(CONFIG.text_case);
    if (window.setPaperSize) window.setPaperSize(CONFIG.paper_size);
    if (window.setCardSides) window.setCardSides(CONFIG.sides === '1' ? 1 : 2);
    if (window.setContentMode) window.setContentMode(CONTENT_MODE);

    async function init() {
      try {
        await Promise.all([
          document.fonts.ready,
        ]);
      } catch (err) {
        console.warn("Font preloading error:", err);
      }
      renderCard(NAME, POSITION, {
        allowPlaceholder: false,
        mode: CONTENT_MODE,
        textCase: CONFIG.text_case,
        nameFontFamily: nameFontFamily,
        posFontFamily: posFontFamily,
        nameFontSize: CONFIG.font_size_name,
        posFontSize: CONFIG.font_size_pos,
        spacingGap: parseFloat(CONFIG.spacing_gap) || 40.0,
        isAutoSpacing: !(String(CONFIG.spacing_is_manual) === "1" || String(CONFIG.spacing_is_manual).toLowerCase() === "true"),
        horizontalOffset: parseFloat(CONFIG.horizontal_offset) || 0.0,
      });
      window.__rendered = true;
    }

    init();
  </script>
</body>
</html>
